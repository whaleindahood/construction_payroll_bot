[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "construction-payroll-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "alembic>=1.16,<2",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.43,<3",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
